name: Validate dispatch workflow
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dispatch_test
          POSTGRES_USER: dispatch
          POSTGRES_PASSWORD: ci_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dispatch -d dispatch_test"
          --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://dispatch:ci_only_password@localhost:5432/dispatch_test
      TEST_DATABASE_URL: postgresql://dispatch:ci_only_password@localhost:5432/dispatch_test
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm test
      - run: npm --prefix frontend run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
